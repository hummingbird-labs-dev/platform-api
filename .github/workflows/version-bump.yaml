name: Increment Version

on:
  push:
    branches:
      - main

jobs:
  auto-tag:
    runs-on: arc-runner-set
    permissions:
      contents: write # Required to push tags

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history and existing tags

      - name: Extract Version from Gradle
        id: gradle_version
        run: |
          # Reads the 'version=' line, strips whitespace, and removes quotes
          VERSION=$(grep '^version =' build.gradle | cut -d'=' -f2 | tr -d '[:space:]"')
          echo "Base Gradle Version: $VERSION"
          # Saves it as an output variable for subsequent steps
          echo "Setting output version for GitHub Actions to $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create and Push Tag
        uses: anothrNick/github-tag-action@1.71.0 # Verify latest on GitHub Marketplace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional configurations:
          WITH_V: true
          INITIAL_VERSION: ${{ steps.gradle_version.outputs.version }}
