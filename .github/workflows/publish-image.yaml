name: Build and publish image

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  tag-version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on:
      - arc-runner-set
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Tag Current Commit
        run: .github/tag-version.sh

  build:
    needs: [tag-version]
    runs-on:
      - arc-runner-set
    outputs:
      version: ${{ steps.gradle-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      
      - name: Get version from Gradle
        id: gradle-version
        run: |
          VERSION=$(./gradlew -q properties --no-daemon | grep "^version:" | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Image version: $VERSION"
      
      - name: Build and test
        run: ./gradlew --no-daemon clean build
      
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: platform-api-jar
          path: build/libs/platform-api-*.jar
          retention-days: 1

  publish:
    if: github.event_name == 'push'
    needs: [build]
    runs-on:
      - arc-runner-set
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: platform-api-jar
          path: build/libs/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: registry.lan.hummingbirdlabs.dev/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=ref,event=tag
            type=raw,value=${{ needs.build.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
