plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

def buildTimeFormatted = new Date().format('yyyy-MM-dd\'T\'HH:mm:ss\'Z\'', TimeZone.getTimeZone('UTC'))

group = 'dev.hummingbirdlabs'
version = project.hasProperty('version') ? project.version : baseVersion
description = 'Hummingbird Labs platform API'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	
	// Kubernetes client for workload queries
	implementation 'io.kubernetes:client-java:20.0.1'
	
	// HTTP client for registry queries
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	
	// OpenAPI/Swagger documentation
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
	
	// JSON processing
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

processResources {
	filesMatching(['application.properties', 'application.yaml', 'application.yml']) {
		filter { line ->
			line.replaceAll('@project.name@', project.name)
				.replaceAll('@project.version@', project.version.toString())
				.replaceAll('@project.description@', project.description ?: '')
				.replaceAll('@project.build.sourceEncoding@', 'UTF-8')
				.replaceAll('@java.version@', JavaVersion.current().toString())
		}
	}
}
